<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pen Plotter — 手書きスタジオ</title>
  <meta name="description" content="原稿を書き、あなたの筆跡で清書し、そのままペンプロッタで紙に描く。">
  <meta name="theme-color" content="#f1efea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121210" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e0442a'/%3E%3Cpath d='M8 23c4-1 6-5 8-9s4-6 8-6' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/static/base.css">
  <link rel="stylesheet" href="/static/studio.css">
  <script>
    // 初回描画前にテーマを当てる（ちらつき防止）
    try {
      const t = localStorage.getItem("pp.theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <script type="importmap">
    { "imports": { "preact": "/static/vendor/preact.module.js", "preact/hooks": "/static/vendor/hooks.module.js", "htm": "/static/vendor/htm.module.js" } }
  </script>
  <link rel="modulepreload" href="/static/vendor/preact.module.js">
  <link rel="modulepreload" href="/static/vendor/hooks.module.js">
  <link rel="modulepreload" href="/static/vendor/htm.module.js">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <!-- 画面は studio/view.js（Preact）が描く -->
  <div id="root" class="root"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
