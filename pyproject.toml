[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pen-plotter"
version = "0.1.0"
description = "手書き風文字生成ペンプロッタ制御プログラム"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "matplotlib",
    "pyserial",
    "scikit-image>=0.26.0",
    "cairosvg",
]

[project.optional-dependencies]
ml = ["torch==2.14.1+cu126", "torchvision==0.29.1+cu126", "scipy"]
ui = ["fastapi", "uvicorn"]
dev = ["pytest", "ruff"]
e2e = ["playwright==1.56.0"]  # 画面テスト（tests/test_ui_e2e.py）。別途 playwright install chromium
build = ["pyinstaller"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "BLE"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # 日本語の全角記号（、。（）等）を含む文字列・コメント
    "B905",  # zip(strict=) は長さが一致する前提の箇所が多く、付けても可読性が下がるだけ
    "SIM105",  # try/except/pass の方が意図（握りつぶす理由のコメント）を書きやすい
    "SIM300",  # 範囲チェック（lo <= x <= hi 相当）を Yoda 条件と誤検出する
]

[tool.ruff.lint.per-file-ignores]
"src/ui/content.py" = ["E501"]  # HTML/Markdown の文字列リテラル
"tests/**" = ["BLE001"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: 実行に時間がかかるテスト（MLなど）",
    "hardware: 実機接続が必要なテスト",
    "e2e: 実ブラウザでの画面テスト（Playwright が無ければスキップ）",
]
